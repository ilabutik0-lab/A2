<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>A2 Bunny Suit</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080a0f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }
    .ui-wrapper {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(35px, env(safe-area-inset-bottom) + 20px);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }
    .label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #00f0ff;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
      font-weight: 700;
    }
    .btn {
      pointer-events: auto;
      touch-action: manipulation;
      min-width: 250px;
      padding: 16px 30px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ffffff;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.35), rgba(255, 0, 128, 0.4));
      border: 1.5px solid #00f0ff;
      border-radius: 35px;
      cursor: pointer;
      outline: none;
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.15s ease, background 0.2s ease;
    }
    .btn:active {
      transform: scale(0.95);
      background: linear-gradient(135deg, rgba(255, 0, 128, 0.6), rgba(0, 240, 255, 0.6));
      border-color: #ff0080;
    }
    .caption {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="ui-wrapper">
    <div class="label">YoRHa Unit Type-A No.2</div>
    <button id="toggleBtn" class="btn">Превратить в А2</button>
    <div class="caption">Ведите пальцем по экрану</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const btn = document.getElementById('toggleBtn');

    let w, h;
    let particles = [];
    let isSilhouetted = false;
    let touch = { x: -1000, y: -1000, active: false };

    function resize() {
      w = window.innerWidth;
      h = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      if (ctx.resetTransform) ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', () => {
      resize();
      initParticles(isSilhouetted);
    });
    resize();

    function getSilhouettePoints() {
      const off = document.createElement('canvas');
      const offCtx = off.getContext('2d');
      off.width = 400;
      off.height = 650;

      offCtx.fillStyle = '#000';
      offCtx.fillRect(0, 0, off.width, off.height);
      offCtx.fillStyle = '#fff';
      offCtx.strokeStyle = '#fff';

      const cx = 200;
      const cy = 340;

      // Ушки
      offCtx.beginPath();
      offCtx.moveTo(cx - 16, cy - 180);
      offCtx.bezierCurveTo(cx - 40, cy - 250, cx - 35, cy - 305, cx - 15, cy - 315);
      offCtx.bezierCurveTo(cx - 4, cy - 305, cx - 6, cy - 240, cx - 8, cy - 180);
      offCtx.fill();

      offCtx.beginPath();
      offCtx.moveTo(cx + 8, cy - 180);
      offCtx.bezierCurveTo(cx + 25, cy - 235, cx + 55, cy - 275, cx + 62, cy - 260);
      offCtx.bezierCurveTo(cx + 65, cy - 250, cx + 40, cy - 220, cx + 16, cy - 180);
      offCtx.fill();

      // Ободок
      offCtx.beginPath();
      offCtx.arc(cx, cy - 170, 20, Math.PI * 0.9, Math.PI * 2.1);
      offCtx.lineWidth = 5;
      offCtx.stroke();

      // Длинные волосы А2
      offCtx.beginPath();
      offCtx.moveTo(cx - 14, cy - 170);
      offCtx.bezierCurveTo(cx - 70, cy - 140, cx - 85, cy - 60, cx - 70, cy + 20);
      offCtx.lineTo(cx - 55, cy - 10);
      offCtx.bezierCurveTo(cx - 60, cy - 70, cx - 45, cy - 120, cx - 18, cy - 140);
      offCtx.fill();

      offCtx.beginPath();
      offCtx.moveTo(cx + 10, cy - 170);
      offCtx.bezierCurveTo(cx + 65, cy - 140, cx + 80, cy - 60, cx + 68, cy + 30);
      offCtx.lineTo(cx + 52, cy + 5);
      offCtx.bezierCurveTo(cx + 58, cy - 70, cx + 45, cy - 120, cx + 18, cy - 140);
      offCtx.fill();

      // Голова и воротник-бабочка
      offCtx.beginPath();
      offCtx.arc(cx, cy - 160, 16, 0, Math.PI * 2);
      offCtx.fill();
      offCtx.fillRect(cx - 6, cy - 146, 12, 16);

      offCtx.beginPath();
      offCtx.moveTo(cx, cy - 138);
      offCtx.lineTo(cx - 11, cy - 143);
      offCtx.lineTo(cx - 11, cy - 133);
      offCtx.lineTo(cx + 11, cy - 143);
      offCtx.lineTo(cx + 11, cy - 133);
      offCtx.closePath();
      offCtx.fill();

      // Корсет / Боди
      offCtx.beginPath();
      offCtx.moveTo(cx - 24, cy - 125);
      offCtx.bezierCurveTo(cx - 30, cy - 90, cx - 16, cy - 65, cx - 15, cy - 45);
      offCtx.bezierCurveTo(cx - 30, cy - 15, cx - 42, cy + 20, cx - 25, cy + 42);
      offCtx.lineTo(cx, cy + 52);
      offCtx.lineTo(cx + 25, cy + 42);
      offCtx.bezierCurveTo(cx + 42, cy + 20, cx + 30, cy - 15, cx + 15, cy - 45);
      offCtx.bezierCurveTo(cx + 16, cy - 65, cx + 30, cy - 90, cx + 24, cy - 125);
      offCtx.closePath();
      offCtx.fill();

      // Хвостик
      offCtx.beginPath();
      offCtx.arc(cx - 35, cy + 24, 13, 0, Math.PI * 2);
      offCtx.fill();

      // Руки и Катана
      offCtx.beginPath();
      offCtx.moveTo(cx - 24, cy - 122);
      offCtx.lineTo(cx - 48, cy - 80);
      offCtx.lineTo(cx - 26, cy - 48);
      offCtx.lineWidth = 10;
      offCtx.lineCap = 'round';
      offCtx.stroke();

      offCtx.beginPath();
      offCtx.moveTo(cx + 24, cy - 122);
      offCtx.lineTo(cx + 50, cy - 75);
      offCtx.lineTo(cx + 44, cy - 30);
      offCtx.lineWidth = 10;
      offCtx.stroke();

      offCtx.beginPath();
      offCtx.moveTo(cx + 38, cy + 130);
      offCtx.lineTo(cx + 56, cy - 200);
      offCtx.lineWidth = 3;
      offCtx.stroke();

      // Ноги
      offCtx.beginPath();
      offCtx.moveTo(cx - 20, cy + 40);
      offCtx.bezierCurveTo(cx - 26, cy + 105, cx - 21, cy + 170, cx - 18, cy + 210);
      offCtx.bezierCurveTo(cx - 16, cy + 245, cx - 20, cy + 285, cx - 25, cy + 300);
      offCtx.lineTo(cx - 15, cy + 300);
      offCtx.bezierCurveTo(cx - 10, cy + 245, cx - 8, cy + 170, cx - 6, cy + 48);
      offCtx.closePath();
      offCtx.fill();

      offCtx.beginPath();
      offCtx.moveTo(cx + 20, cy + 40);
      offCtx.bezierCurveTo(cx + 28, cy + 105, cx + 26, cy + 170, cx + 22, cy + 210);
      offCtx.bezierCurveTo(cx + 20, cy + 245, cx + 23, cy + 285, cx + 28, cy + 300);
      offCtx.lineTo(cx + 18, cy + 300);
      offCtx.bezierCurveTo(cx + 13, cy + 245, cx + 11, cy + 170, cx + 6, cy + 48);
      offCtx.closePath();
      offCtx.fill();

      const imgData = offCtx.getImageData(0, 0, off.width, off.height).data;
      const points = [];
      const step = 6;

      const scale = Math.min(w / 440, (h - 120) / 680) * 0.92;
      const offsetX = w / 2;
      const offsetY = h / 2 - 25;

      for (let y = 0; y < off.height; y += step) {
        for (let x = 0; x < off.width; x += step) {
          const idx = (y * off.width + x) * 4;
          if (imgData[idx] > 160) {
            points.push({
              x: offsetX + (x - cx) * scale,
              y: offsetY + (y - cy) * scale
            });
          }
        }
      }
      return points;
    }

    class Particle {
      constructor(targetX, targetY) {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.chaosX = this.x;
        this.chaosY = this.y;
        this.vx = (Math.random() - 0.5) * 1.5;
        this.vy = (Math.random() - 0.5) * 1.5;

        this.targetX = targetX;
        this.targetY = targetY;
        this.size = Math.random() * 1.8 + 1.2;

        const rnd = Math.random();
        if (rnd < 0.6) this.color = '#00f0ff';
        else if (rnd < 0.88) this.color = '#ff2a8d';
        else this.color = '#ffffff';

        this.ease = 0.05 + Math.random() * 0.04;
      }

      update() {
        let destX = isSilhouetted ? this.targetX : this.chaosX;
        let destY = isSilhouetted ? this.targetY : this.chaosY;

        if (!isSilhouetted) {
          this.chaosX += this.vx;
          this.chaosY += this.vy;
          if (this.chaosX < 10 || this.chaosX > w - 10) this.vx *= -1;
          if (this.chaosY < 10 || this.chaosY > h - 10) this.vy *= -1;
        }

        this.x += (destX - this.x) * this.ease;
        this.y += (destY - this.y) * this.ease;

        if (touch.active) {
          const dx = this.x - touch.x;
          const dy = this.y - touch.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 90) {
            const force = (90 - dist) / 90;
            const angle = Math.atan2(dy, dx);
            this.x += Math.cos(angle) * force * 16;
            this.y += Math.sin(angle) * force * 16;
          }
        }
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initParticles(force = false) {
      const targets = getSilhouettePoints();
      particles = targets.map(t => new Particle(t.x, t.y));
      if (force) isSilhouetted = true;
    }

    initParticles();

    function toggle() {
      isSilhouetted = !isSilhouetted;
      btn.textContent = isSilhouetted ? 'Рассеять частицы' : 'Превратить в А2';
    }

    btn.addEventListener('click', (e) => {
      e.preventDefault();
      toggle();
    });

    const updateTouch = (e) => {
      if (e.touches && e.touches[0]) {
        touch.x = e.touches[0].clientX;
        touch.y = e.touches[0].clientY;
        touch.active = true;
      }
    };

    window.addEventListener('touchstart', updateTouch, { passive: true });
    window.addEventListener('touchmove', updateTouch, { passive: true });
    window.addEventListener('touchend', () => { touch.active = false; }, { passive: true });

    function animate() {
      ctx.fillStyle = 'rgba(8, 10, 15, 0.4)';
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
